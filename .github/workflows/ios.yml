name: iOS CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS CI
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios
    
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout iOS submodule only
        # This workflow builds an iOS IPA; recursively checking out the root
        # submodules also clones Amethyst-Android and its SSH-only dependencies.
        run: |
          git submodule update --init Amethyst-iOS
          git -C Amethyst-iOS submodule sync
          # The upstream URLs for these two public dependencies currently fail.
          # Redirect them to accessible public mirrors before initializing them.
          git config --global url."https://github.com/immago/DBNumberedSlider.git".insteadOf "https://github.com/khanhduytran0/DBNumberedSlider"
          git config --global url."https://github.com/facebook/fishhook.git".insteadOf "https://github.com/khanhduytran0/fishhook"
          git -C Amethyst-iOS submodule update --init --recursive

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('.github/workflows/ios.yml') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Install dependencies
        run: |
          brew install gpatch make ldid
          brew install --cask zulu@8
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 1.8)" >> "$GITHUB_ENV"

      - name: Patch files
        run: |
          gpatch ./Amethyst-iOS/Natives/MinecraftResourceDownloadTask.m MinecraftResourceDownloadTask.patch
          gpatch ./Amethyst-iOS/Natives/JavaLauncher.m JavaLauncher.patch
          gpatch ./Amethyst-iOS/Natives/CMakeLists.txt CMakeLists.patch

      - name: Integrate Mod Browser
        run: |
          cp ModBrowser/ModBrowserViewController.h Amethyst-iOS/Natives/ModBrowserViewController.h
          cp ModBrowser/ModBrowserViewController.m Amethyst-iOS/Natives/ModBrowserViewController.m
          python3 - <<'PY'
          from pathlib import Path
          cmake = Path("Amethyst-iOS/Natives/CMakeLists.txt")
          source = cmake.read_text()
          marker = "  LauncherMenuViewController.m\n"
          entry = "  ModBrowserViewController.m\n"
          if entry not in source:
              if marker not in source: raise SystemExit("Could not find native source list in CMakeLists.txt")
              source = source.replace(marker, marker + entry, 1)
              cmake.write_text(source)
          menu = Path("Amethyst-iOS/Natives/LauncherMenuViewController.m")
          source = menu.read_text()
          im = '#import "LauncherMenuViewController.h"\n'
          bi = '#import "ModBrowserViewController.h"\n'
          if bi not in source:
              if im not in source: raise SystemExit("Could not find launcher menu imports")
              source = source.replace(im, im + bi, 1)
          entry = '        [LauncherMenuCustomItem vcClass:ModBrowserViewController.class],\n'
          if entry not in source:
              pm = '        [LauncherMenuCustomItem vcClass:LauncherProfilesViewController.class],\n'
              if pm not in source: raise SystemExit("Could not find Profiles menu entry")
              source = source.replace(pm, pm + entry, 1)
          assignment = '        selected.vcArray[0].navigationItem.rightBarButtonItem = self.accountBtnItem;\n'
          guarded = ('        if (![selected.vcArray[0] isKindOfClass:ModBrowserViewController.class]) {\n'
                     '            selected.vcArray[0].navigationItem.rightBarButtonItem = self.accountBtnItem;\n'
                     '        }\n')
          if assignment in source: source = source.replace(assignment, guarded, 1)
          elif guarded not in source: raise SystemExit("Could not locate account button assignment")
          menu.write_text(source)

          # Give the main-menu download progress screen an explicit Close button.
          progress_vc = Path("Amethyst-iOS/Natives/DownloadProgressViewController.m")
          source = progress_vc.read_text()
          icon_close = 'self.navigationItem.rightBarButtonItem = [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemClose target:self action:@selector(actionClose)];'
          text_close = 'self.navigationItem.rightBarButtonItem = [[UIBarButtonItem alloc] initWithTitle:@"Close" style:UIBarButtonItemStylePlain target:self action:@selector(actionClose)];'
          if icon_close in source: source = source.replace(icon_close, text_close, 1)
          progress_vc.write_text(source)

          # Reconnect background URLSession events after iOS relaunches the app.
          app_delegate = Path("Amethyst-iOS/Natives/AppDelegate.m")
          source = app_delegate.read_text()
          handler_marker = '// STLauncher background URLSession event bridge'
          if handler_marker not in source:
              import_marker = '#import "utils.h"'
              if import_marker not in source: raise SystemExit("Could not locate AppDelegate imports")
              source = source.replace(import_marker, import_marker + '\n\nstatic void (^stBackgroundSessionCompletionHandler)(void);', 1)
              method = """
          // STLauncher background URLSession event bridge
          - (void)application:(UIApplication *)application handleEventsForBackgroundURLSession:(NSString *)identifier completionHandler:(void (^)(void))completionHandler {
              if (![identifier isEqualToString:@"com.st.stlauncher.modbrowser.downloads"]) {
                  completionHandler();
                  return;
              }
              stBackgroundSessionCompletionHandler = [completionHandler copy];
              [[NSNotificationCenter defaultCenter] removeObserver:self name:@"STBackgroundURLSessionDidFinishEvents" object:nil];
              [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(st_backgroundSessionDidFinishEvents:) name:@"STBackgroundURLSessionDidFinishEvents" object:nil];
              Class coordinatorClass = NSClassFromString(@"STDownloadCoordinator");
              if (coordinatorClass && [coordinatorClass respondsToSelector:NSSelectorFromString(@"shared")]) {
                  [coordinatorClass performSelector:NSSelectorFromString(@"shared")];
              }
          }
          - (void)st_backgroundSessionDidFinishEvents:(NSNotification *)notification {
              [[NSNotificationCenter defaultCenter] removeObserver:self name:@"STBackgroundURLSessionDidFinishEvents" object:nil];
              void (^handler)(void) = stBackgroundSessionCompletionHandler;
              stBackgroundSessionCompletionHandler = nil;
              if (handler) handler();
          }
          """
              source = source.replace('\n@end', '\n' + method + '\n@end', 1)
              app_delegate.write_text(source)
          PY

      - name: Build for ${{ matrix.platform_name }}
        run: |
          cd Amethyst-iOS
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=1
          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            # Build ipa and tipa for iOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} BRANCH=main 
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 BRANCH=main 
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            # Build tipa only for tvOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 BRANCH=main 
          else
            # Build ipa only for everything else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} BRANCH=main 
          fi

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}.ipa
          path: Amethyst-iOS/artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}-trollstore.tipa
          path: Amethyst-iOS/artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload slimmed ipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}.ipa
          path: Amethyst-iOS/artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}.ipa

      - name: Upload slimmed tipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}-trollstore.tipa
          path: Amethyst-iOS/artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload PojavLauncher.dSYM
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'ios'
        with:
          name: AngelAuraAmethyst.dSYM
          path: Amethyst-iOS/artifacts/AngelAuraAmethyst.dSYM
